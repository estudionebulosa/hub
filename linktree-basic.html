<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Creator - Links</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font:16px/1.4 system-ui;background:#0a0a0a;color:#fff;padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .container{max-width:400px;width:100%;text-align:center}
        .profile{margin-bottom:30px}
        .avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 15px;display:block;border:2px solid #333}
        h1{font-size:24px;margin-bottom:5px}
        .bio{color:#888;font-size:14px;margin-bottom:15px}
        .stats{font-size:12px;color:#666}
        .links{list-style:none}
        .link{margin-bottom:12px}
        .link a{display:block;padding:15px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;text-decoration:none;transition:all .2s}
        .link a:hover{background:#222;border-color:#555;transform:translateY(-1px)}
        .link a:focus{outline:2px solid #555}
        .footer{margin-top:30px;font-size:12px;color:#666}
        .eco{color:#4ade80;font-size:11px}
        @media(max-width:480px){
            body{padding:15px}
            .link a{padding:12px}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <svg class="avatar" viewBox="0 0 80 80" style="background:#333">
                <circle cx="40" cy="30" r="12" fill="#666"></circle>
                <path d="M20 65 Q20 50 40 50 Q60 50 60 65 Z" fill="#666"></path>
            </svg>
            <h1>Alex Creator</h1>
            <p class="bio">Diseñador • Creador • Tech</p>
            <div class="stats">2.3k vistas • 156 clicks</div>
        </div>
        
        <ul class="links">
            <li class="link">
                <a href="#" onclick="track('portfolio')">🌐 Mi Portfolio</a>
            </li>
            <li class="link">
                <a href="#" onclick="track('blog')">✍️ Blog Personal</a>
            </li>
            <li class="link">
                <a href="#" onclick="track('instagram')">📸 Instagram</a>
            </li>
            <li class="link">
                <a href="#" onclick="track('youtube')">🎥 YouTube</a>
            </li>
            <li class="link">
                <a href="#" onclick="track('twitter')">🐦 Twitter</a>
            </li>
            <li class="link">
                <a href="#" onclick="track('contact')">✉️ Contacto</a>
            </li>
        </ul>
        
        <div class="footer">
            <div class="eco">🌱 Diseño eco-friendly</div>
            <div>Actualizado hoy • <span style="color:#4ade80;">En línea</span></div>
        </div>
    </div>

</body>
</html>
